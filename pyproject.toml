[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "limits-of-resolution-qml"
version = "1.0.0"
description = "Limits of Resolution in Quantum Machine Learning: A Statistical Noise Budget for Small Benchmarks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Enrique Real", email = "enriquerb32@gmail.com" }
]
keywords = [
    "quantum-machine-learning",
    "qml",
    "physics-informed",
    "pennylane",
    "statistical-noise-budget",
    "reproducibility",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.0",
    "numpy>=2.0",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pennylane>=0.45",
    "pennylane-qiskit>=0.45",
    "qiskit-aer>=0.17",
    "xgboost>=2.0",
    "pmdarima>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pypdf>=4.0",
]

[tool.uv.extra-build-dependencies]
ibm-platform-services = ["setuptools<70"]

