[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qml-resolution"
version = "1.1.0"
description = "Statistical resolution of small ML and QML benchmarks: paired DeLong, cluster bootstrap and minimum detectable differences"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Enrique Real", email = "enriquerb32@gmail.com" }]
keywords = [
    "quantum-machine-learning",
    "benchmarking",
    "statistical-power",
    "delong",
    "bootstrap",
    "pennylane",
    "reproducibility",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
# The library (src/qml_resolution) needs only NumPy and SciPy.
dependencies = ["numpy>=1.26", "scipy>=1.12"]

[project.optional-dependencies]
# Everything needed to retrain the models of the paper (pinned versions: requirements.lock).
pipeline = [
    "torch>=2.0",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pennylane>=0.45",
    "pennylane-qiskit>=0.45",
    "qiskit-aer>=0.17",
    "xgboost>=2.0,<2.1",
    "pmdarima>=2.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "scikit-learn>=1.4",
    "pypdf>=4.0",
    "pre-commit>=3.7",
]

[project.urls]
Repository = "https://github.com/enriquerb32/limits-of-resolution-qml"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qml_resolution = ["py.typed"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "slow: long-running checks against archived results (deselect with -m 'not slow')",
    "quantum: needs PennyLane and PyTorch",
]
filterwarnings = ["ignore::FutureWarning:sklearn.*"]

[tool.coverage.run]
source = ["qml_resolution"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 120
target-version = "py311"
# The legacy pipeline in code/ is frozen for reproducibility of the archived results
# (checkpoints are pickles that depend on its module names); it is linted only for errors.
extend-exclude = ["archive", "backup_*", "notebooks", "scratch", "resultados"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF", "N", "D"]
ignore = ["D105", "D107", "D203", "D213", "D413"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "N802", "N806"]
"src/qml_resolution/_validation.py" = ["D"]
"code/**" = ["E", "W", "I", "B", "UP", "SIM", "NPY", "RUF", "N", "D", "F401", "F841", "E741"]
"scripts/**" = ["E", "W", "I", "B", "UP", "SIM", "NPY", "RUF", "N", "D", "F401", "F841", "E741"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
