# ──────────────────────────────────────────────────────────────────────────────
# limits-of-resolution-qml — Conda environment for reproducibility
# ──────────────────────────────────────────────────────────────────────────────
# Usage:
#   conda env create -f environment.yml
#   conda activate qml-resolution
#   python code/local_experiments/exp7_noise_budget.py
# ──────────────────────────────────────────────────────────────────────────────
name: qml-resolution

channels:
  - conda-forge
  - nodefaults

dependencies:
  # ── Python runtime ──
  - python=3.12.*

  # ── Core scientific stack ──
  - numpy>=2.0,<2.3
  - pandas>=2.0,<3.0
  - scipy>=1.12,<1.15
  - scikit-learn>=1.4,<1.6

  # ── Deep learning (CPU) ──
  - pytorch>=2.0,<2.6
  - cpuonly                    # Use `pytorch-cuda=12.1` on conda-forge for GPU

  # ── Visualization ──
  - matplotlib>=3.8,<3.11
  - seaborn>=0.13,<0.15

  # ── Boosting ──
  - xgboost>=2.0,<2.2

  # ── Quantum computing & pip packages ──
  - pip
  - pip:
      - pennylane>=0.40,<0.47
      - pennylane-lightning>=0.40,<0.47
      - pennylane-qiskit>=0.40
      - qiskit-aer>=0.15
      - pmdarima>=2.0
