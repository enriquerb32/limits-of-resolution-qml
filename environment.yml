# ──────────────────────────────────────────────────────────────────────────────
# QML_Antigravity — Conda environment for reproducibility
# ──────────────────────────────────────────────────────────────────────────────
# Usage:
#   conda env create -f environment.yml
#   conda activate qml_antigravity
#   python code/local_experiments/exp7_noise_budget.py
# ──────────────────────────────────────────────────────────────────────────────
name: qml_antigravity
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  # ── Python runtime ──
  - python=3.12

  # ── Core scientific stack ──
  - numpy>=2.0
  - pandas>=2.0
  - scipy>=1.12
  - scikit-learn>=1.4

  # ── Deep learning ──
  - pytorch>=2.0
  - cpuonly                    # Use `pytorch-cuda=12.1` instead for GPU

  # ── Visualization ──
  - matplotlib>=3.8
  - seaborn>=0.13

  # ── Boosting ──
  - xgboost>=2.0

  # ── pip-only packages (not on conda-forge) ──
  - pip
  - pip:
      # Quantum computing
      - pennylane>=0.45
      - pennylane-qiskit>=0.45
      - qiskit-aer>=0.17

      # Time series (optional)
      - pmdarima>=2.1
